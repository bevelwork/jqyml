services:
  jqyml:
    build: .
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/state', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - jqyml_state:/app/state
  caddy:
    image: caddy:alpine
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      jqyml:
        condition: service_healthy
volumes:
  jqyml_state:
