services:
  jqyml:
    build: .
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "--connect-timeout", "2", "--max-time", "5", "http://127.0.0.1:8888/state"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      # Mount app code so edits are reflected without rebuild (Python and jq subprocesses read files at runtime)
      - .:/app
      # Override /app/state with named volume so state is persisted and not overwritten by the bind mount
      - jqyml_state:/app/state
  caddy:
    image: caddy:alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      jqyml:
        condition: service_healthy
volumes:
  jqyml_state:
  caddy_data:
