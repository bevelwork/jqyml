services:
  jqyml:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - jqyml_state:/app/state
  caddy:
    image: caddy:alpine
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      jqyml:
        condition: service_healthy
volumes:
  jqyml_state:
